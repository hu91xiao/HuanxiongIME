customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Rime::SwitcherSettings"
  modified_time: "Wed Oct 28 09:58:37 2026"
  rime_version: 1.13.1
patch:
  app_options:
    UE4Editor.exe: {ascii_mode: true}
    UnrealEditor.exe: {ascii_mode: true}
    WindowsTerminal.exe: {ascii_mode: true}
    blender.exe: {ascii_mode: true}
    chrome.exe: {ascii_mode: false}
    cmd.exe: {ascii_mode: true}
    code.exe: {ascii_mode: true}
    devenv.exe: {ascii_mode: true}
    msedge.exe: {ascii_mode: false}
    "notepad++.exe": {ascii_mode: true}
    powershell.exe: {ascii_mode: true}
  ascii_composer:
    good_old_caps_lock: true
    switch_key: {Caps_Lock: commit_code, Control_L: noop, Control_R: noop, Shift_L: noop, Shift_R: noop}
  key_binder:
    bindings: [{accept: semicolon, send: 2, when: has_menu}, {accept: apostrophe, send: 3, when: has_menu}, {accept: minus, send: Page_Up, when: has_menu}, {accept: equal, send: Page_Down, when: has_menu}, {accept: "Shift+Tab", send: Page_Up, when: has_menu}, {accept: Tab, send: Page_Down, when: has_menu}, {accept: Return, send: Escape, when: composing}, {accept: "Control+p", send: Up, when: composing}, {accept: "Control+n", send: Down, when: composing}, {accept: "Control+b", send: Left, when: composing}, {accept: "Control+f", send: Right, when: composing}, {accept: "Control+a", send: Home, when: composing}, {accept: "Control+e", send: End, when: composing}, {accept: "Control+d", send: Delete, when: composing}, {accept: "Control+k", send: "Shift+Delete", when: composing}, {accept: "Control+h", send: BackSpace, when: composing}, {accept: "Control+g", send: Escape, when: composing}, {accept: "Control+bracketleft", send: Escape, when: composing}, {accept: "Alt+v", send: Page_Up, when: composing}, {accept: "Control+v", send: Page_Down, when: composing}]
  menu:
    page_size: 3
  punctuator:
    full_shape: {" ": {commit: "　"}, "!": {commit: "！"}, "\"": {pair: ["“", "”"]}, "#": ["＃", "⌘"], "$": "￥", "%": "％", "&": "＆", "'": {pair: ["‘", "’"]}, "(": "（", ")": "）", "*": ["＊", "・", "×"], "+": "＋", ",": {commit: "，"}, "-": "－", .: {commit: "。"}, "/": ["／", "÷"], ":": {commit: "："}, ";": {commit: "；"}, "<": ["《", "〈", "«", "‹"], "=": "＝", ">": ["》", "〉", "»", "›"], "?": {commit: "？"}, "@": "＠", "[": ["「", "【", "〔", "［"], "\\": ["、", "＼"], "]": ["」", "】", "〕", "］"], "^": {commit: "……"}, _: "——", "`": "｀", "{": ["『", "〖", "｛"], "|": ["·", "｜", "§", "¦"], "}": ["』", "〗", "｝"], "~": "～"}
    half_shape: {"!": {commit: "！"}, "\"": {pair: ["“", "”"]}, "#": "#", "$": "￥", "%": ["%", "％", "°", "℃"], "&": "&", "'": {pair: ["‘", "’"]}, "(": "（", ")": "）", "*": ["·", "×"], "+": "+", ",": {commit: "，"}, "-": {commit: "-"}, .: {commit: "。"}, "/": {commit: "、"}, ":": {commit: "："}, ";": {commit: "；"}, "<": {commit: "《"}, "=": {commit: "="}, ">": {commit: "》"}, "?": {commit: "？"}, "@": "@", "[": {commit: "【"}, "\\": {commit: "、"}, "]": {commit: "】"}, "^": {commit: "……"}, _: "——", "`": "`", "{": "「", "|": "|", "}": "」", "~": "~"}
  recognizer:
    patterns: {email: "^[-_.0-9A-Za-z]+@.*$", uppercase: "[A-Z][-_+.'0-9A-Za-z]*$", url: "^(www[.]|https?:|ftp[.:]|mailto:|file:|localhost).*$|^[a-z]+[.].+$"}
  schema_list:
    - {schema: wubi86_jidian_pinyin}   # 五笔拼音混输（默认，主用）
    - {schema: wubi86_jidian}          # 纯五笔
    - {schema: pinyin_simp}            # 简体拼音
    - {schema: numbers}                # 大写数字
  switcher:
    abbreviate_options: true
    caption: "【 输入法设置 】"
    hotkeys: ["Control+0", "Shift+Control+0"]
    option_list_separator: "｜"